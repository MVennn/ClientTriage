name: 功能建议
description: 想要新的判定手法、诊断工具或文档章节
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前可以先翻翻已有的 Issue，并确认
        [docs/TOOLS.md](https://github.com/MVennn/ClientTriage/blob/main/docs/TOOLS.md)
        与 [docs/LNA-FAKE-IP.md](https://github.com/MVennn/ClientTriage/blob/main/docs/LNA-FAKE-IP.md)
        里没有现成做法。

  - type: textarea
    id: scenario
    attributes:
      label: 什么场景不顺手
      description: |
        先说场景再说想法——「遇到什么现象，现在要手工怎么查，哪一步最容易漏」。
      placeholder: |
        例：
        某个站点只在登录态下出问题，现在只能肉眼对比控制台，
        想要一个能按 URL 过滤并留下证据的只读手法。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的效果（可选）
      description: 希望新增工具、扩展现有参数，还是只补文档判据？
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个建议只涉及客户端侧诊断与取证，不修改路由器配置，也不提供绕过服务方地区限制的方案。
          required: true
        - label: 我知悉新增或改动工具需要在真实 Chrome / Windows 环境验证，愿意配合验证。
          required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
      description: 相关控制台错误、复现环境、参考做法等；敏感值先脱敏
    validations:
      required: false

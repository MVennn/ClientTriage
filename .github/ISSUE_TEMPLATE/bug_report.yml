name: 问题反馈（Bug）
description: 工具跑不通、判定结论对不上、CDP 抓不到控制台等问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量把下面的信息填全，尤其是**执行的命令与输出原文**——
        「对不上」要能对上具体现象，才判断得了是客户端问题还是网络层问题。

        反馈前先查 [docs/TROUBLESHOOTING.md](https://github.com/MVennn/ClientTriage/blob/main/docs/TROUBLESHOOTING.md)。

  - type: checkboxes
    id: acknowledgment
    attributes:
      label: 反馈前确认
      options:
        - label: 我已知悉工具会修改本机 Chrome 用户数据（清地区种子）并会启动临时 Chrome（带调试端口），跑之前已退出自己的 Chrome。
          required: true
        - label: 我已知悉本仓只做定位与取证，不提供绕过服务方地区限制的方案；相关风险由我自行承担。
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 出了什么问题
      description: |
        现象 + 复现步骤：跑了哪个工具、在哪一步失败、预期是什么、实际看到什么。
      placeholder: |
        例：
        1. 完全退出 Chrome 后执行 node tools/clear-chrome-region.js
        2. 脚本报找不到 Preferences
        3. 预期：清掉地区种子；实际：直接退出
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: 出问题的是哪个工具
      options:
        - tools/clear-chrome-region.js（清地区种子）
        - tools/verify-gemini.sh（复测 Gemini）
        - tools/cdp.js（抓控制台）
        - 文档或其它
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: 执行的完整命令
      description: 带上环境变量（不要贴真实口令）
      placeholder: "例：CDP_PORT=9223 node tools/cdp.js"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 环境
      description: Windows 版本、Chrome 版本、代理方式（路由器透明代理 / 本机代理软件）
      placeholder: "例：Windows 11 23H2 / Chrome 155 / 路由器透明代理"
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: 命令输出 / 控制台错误原文
      description: |
        `tools/cdp.js` 抓到的控制台错误请整段贴进来；不要把输出截成一句话。
        贴之前确认没有真实域名、IP、MAC、账号。
      render: shell
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或补充信息（可选）
    validations:
      required: false

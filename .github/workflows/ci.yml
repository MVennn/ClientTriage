name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 语法与文档
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: 装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Shell 语法
        run: find . -name '*.sh' -not -path './third-party/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 sh -n

      - name: JavaScript 语法
        run: find . -name '*.js' -not -path './third-party/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: 文档自检
        run: python3 tools/check-docs.py

      - name: 敏感信息扫描
        run: python3 tools/check-secrets.py
